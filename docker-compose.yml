  # ─────────────────────────────────────────────
  # pgAdmin 
  # ─────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4
    container_name: consigliere_pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    depends_on:
      - db
    restart: unless-stopped

